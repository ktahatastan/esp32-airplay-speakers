<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" role="img" aria-labelledby="title desc">
  <title id="title">Harman Kardom mühendislik tipi modül bağlantı şeması</title>
  <desc id="desc">Örnek EasyEDA pafta stilinde 4S batarya, BMS, güç, ESP32-S3, PCM5102A, XH-A232, kontroller, hoparlörler ve test noktaları şeması.</desc>
  <defs>
    <style>
      .paper{fill:#fff}.border{fill:none;stroke:#9f1d20;stroke-width:1.3}.grid{stroke:#9f1d20;stroke-width:1}.wire{fill:none;stroke:#16843f;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}.power{stroke:#16843f;stroke-width:2.4}.signal{stroke:#16843f;stroke-width:1.8}.part{fill:none;stroke:#9f1d20;stroke-width:1.7}.symbol{fill:none;stroke:#111;stroke-width:1.7}.node{fill:#b91c1c}.nc{stroke:#b91c1c;stroke-width:2.2}.txt{font:14px Arial,sans-serif;fill:#111}.small{font:12px Arial,sans-serif;fill:#111}.tiny{font:10.5px Arial,sans-serif;fill:#111}.pin{font:11px Consolas,monospace;fill:#111}.ref{font:12px Arial,sans-serif;fill:#9f1d20}.value{font:11px Arial,sans-serif;fill:#1d3d8f}.net{font:12px Arial,sans-serif;fill:#1d3d8f}.head{font:700 42px Arial,sans-serif;fill:#111}.main{font:700 48px Arial,sans-serif;fill:#111}.sub{font:700 29px Arial,sans-serif;fill:#111}.note{font:11px Arial,sans-serif;fill:#111}.warn{font:700 12px Arial,sans-serif;fill:#9f1d20}.tp{fill:#fff;stroke:#d24a00;stroke-width:1.8}.tptext{font:700 8px Arial,sans-serif;fill:#b33b00;text-anchor:middle}.sheet{font:12px Arial,sans-serif;fill:#9f1d20}.sheetval{font:15px Arial,sans-serif;fill:#172554}.dash{stroke-dasharray:5 4}
    </style>
    <g id="gnd"><path class="symbol" d="M0 0 V8 M-12 8 H12 M-8 13 H8 M-4 18 H4"/></g>
    <g id="tp"><circle class="tp" cx="0" cy="0" r="11"/></g>
    <g id="res"><path class="symbol" d="M0 0 H8 L14 -8 L26 8 L38 -8 L50 8 L62 -8 L68 0 H76"/></g>
    <g id="cap"><path class="symbol" d="M0 0 H28 M28 -14 V14 M38 -14 V14 M38 0 H66"/></g>
    <g id="switch"><path class="symbol" d="M0 0 H22 M22 0 L52 -18 M52 0 H78"/><circle class="node" cx="22" cy="0" r="3"/><circle class="node" cx="52" cy="0" r="3"/></g>
    <g id="fuse"><path class="part" d="M0 0 H12 M12 -8 H58 V8 H12 Z M58 0 H72"/></g>
    <g id="cell"><path class="symbol" d="M0 0 H18 M18 -13 V13 M28 -7 V7 M28 0 H48"/></g>
    <g id="speaker"><path class="symbol" d="M0 -20 H18 L44 -42 V42 L18 20 H0 Z"/></g>
  </defs>

  <rect class="paper" width="2000" height="1400"/>
  <rect class="border" x="12" y="12" width="1976" height="1376"/>
  <rect class="border" x="24" y="24" width="1952" height="1352"/>

