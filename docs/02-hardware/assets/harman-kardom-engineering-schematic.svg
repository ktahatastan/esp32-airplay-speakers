    <text x="180" y="21">1</text><text x="500" y="21">2</text><text x="820" y="21">3</text><text x="1140" y="21">4</text><text x="1460" y="21">5</text><text x="1780" y="21">6</text>
    <text x="180" y="1385">1</text><text x="500" y="1385">2</text><text x="820" y="1385">3</text><text x="1140" y="1385">4</text><text x="1460" y="1385">5</text><text x="1780" y="1385">6</text>
    <text x="15" y="180">A</text><text x="15" y="500">B</text><text x="15" y="820">C</text><text x="15" y="1140">D</text>
    <text x="1979" y="180">A</text><text x="1979" y="500">B</text><text x="1979" y="820">C</text><text x="1979" y="1140">D</text>
  </g>
  <g class="grid"><path d="M345 12 V24 M665 12 V24 M985 12 V24 M1305 12 V24 M1625 12 V24 M345 1376 V1388 M665 1376 V1388 M985 1376 V1388 M1305 1376 V1388 M1625 1376 V1388"/><path d="M12 345 H24 M12 665 H24 M12 985 H24 M12 1305 H24 M1976 345 H1988 M1976 665 H1988 M1976 985 H1988 M1976 1305 H1988"/></g>

  <text class="main" x="720" y="78">HARMAN KARDOM ACTIVE SPEAKER</text>
  <text class="txt" x="48" y="52">PROTOTYPE / MODÜL BAĞLANTI ŞEMASI</text>
  <text class="note" x="48" y="72">Yeşil: bağlantı ağı · Kırmızı: parça/ref · Mavi: net/değer · TBD/ADAY: ölçüm bekliyor</text>

  <!-- 4S BATTERY AND BMS -->
  <text class="head" x="55" y="145">4S Battery &amp; BMS</text>
  <text class="note" x="60" y="172">Yalnız eşlenmiş yeni hücre, profesyonel punta, balanslı BMS, paket sigortası ve NTC.</text>
  <g transform="translate(70 220)">
    <text class="net" x="0" y="-18">PACK_B+</text>
    <use href="#cell" x="30" y="0"/><text class="ref" x="48" y="-18">BT4</text><text class="value" x="44" y="24">Li-ion</text>
    <use href="#cell" x="30" y="70"/><text class="ref" x="48" y="52">BT3</text>
    <use href="#cell" x="30" y="140"/><text class="ref" x="48" y="122">BT2</text>
    <use href="#cell" x="30" y="210"/><text class="ref" x="48" y="192">BT1</text>
    <path class="wire power" d="M0 0 H30 M118 0 H155 V70 H30 M118 70 H155 V140 H30 M118 140 H155 V210 H30 M118 210 H155 V270 H0"/>
    <text class="net" x="0" y="292">PACK_B−</text>
    <use href="#tp" x="0" y="270"/><text class="tptext" x="0" y="274">TP0</text>
    <use href="#tp" x="155" y="210"/><text class="tptext" x="155" y="214">TP1</text>
    <use href="#tp" x="155" y="140"/><text class="tptext" x="155" y="144">TP2</text>
    <use href="#tp" x="155" y="70"/><text class="tptext" x="155" y="74">TP3</text>
    <use href="#tp" x="155" y="0"/><text class="tptext" x="155" y="4">TP4</text>
  </g>
  <rect class="part" x="285" y="205" width="210" height="330"/>
  <text class="sub" x="305" y="245">4S BMS</text><text class="value" x="310" y="267">balanced · NTC · common-port ref.</text>
  <text class="pin" x="295" y="305">B+</text><text class="pin" x="295" y="350">B3</text><text class="pin" x="295" y="395">B2</text><text class="pin" x="295" y="440">B1</text><text class="pin" x="295" y="485">B−</text>
  <text class="pin" x="455" y="305">P+</text><text class="pin" x="455" y="485">P−</text><text class="pin" x="455" y="520">NTC</text>
  <path class="wire" d="M225 220 H270 V305 H285 M225 290 H260 V350 H285 M225 360 H250 V395 H285 M225 430 H240 V440 H285 M70 490 H285 V485"/>
  <path class="wire power" d="M495 305 H540"/><use href="#tp" x="520" y="305"/><text class="tptext" x="520" y="309">TP5</text>
  <path class="wire" d="M495 485 H540"/><use href="#tp" x="520" y="485"/><text class="tptext" x="520" y="489">TP6</text><text class="net" x="500" y="472">POWER_GND</text>
  <path class="wire dash" d="M495 520 H540"/><use href="#tp" x="520" y="520"/><text class="tptext" x="520" y="524">TP27</text>

  <!-- charging and main power -->
  <text class="sub" x="560" y="140">Charging &amp; Main Power</text>
  <text class="net" x="570" y="205">BMS_P+</text><path class="wire power" d="M540 305 H600 V220"/>
  <use href="#fuse" x="600" y="220"/><text class="ref" x="615" y="202">F_CHG</text><text class="value" x="613" y="244">3 A ADAY</text>
  <path class="wire power" d="M672 220 H735"/><use href="#tp" x="705" y="220"/><text class="tptext" x="705" y="224">TP26</text>
  <rect class="part" x="735" y="185" width="125" height="80"/><text class="ref" x="746" y="205">J8</text><text class="txt" x="755" y="230">CHARGE</text><text class="value" x="748" y="250">16.8 V CC/CV</text>
  <path class="wire" d="M797 265 V485 H540"/>
  <text class="warn" x="565" y="280">V1: şarj sırasında amfi kapalı</text>
  <path class="wire power" d="M540 305 H600 V335"/><use href="#fuse" x="600" y="335"/><text class="ref" x="615" y="317">F1</text><text class="value" x="613" y="359">5 A BAŞLANGIÇ ADAYI</text>
  <path class="wire power" d="M672 335 H700"/><use href="#tp" x="695" y="335"/><text class="tptext" x="695" y="339">TP7</text>
  <use href="#switch" x="705" y="335"/><text class="ref" x="724" y="305">S1</text><text class="value" x="714" y="379">24 VDC / 5 A</text>
  <path class="wire power" d="M783 335 H875"/><use href="#tp" x="820" y="335"/><text class="tptext" x="820" y="339">TP8</text><text class="net" x="798" y="316">VBAT_SW 12.0–16.8 V</text>

  <!-- buck module with caps -->
  <text class="head" x="920" y="145">12–16.8 V to 5.10 V</text>
  <path class="wire power" d="M875 335 H925"/>
  <use href="#cap" x="895" y="285"/><text class="ref" x="920" y="267">C_A</text><text class="value" x="900" y="322">470–1000 µF / 25 V ADAY</text><path class="wire" d="M923 285 V335 M933 285 V485"/>
  <rect class="part" x="925" y="300" width="205" height="125"/>
  <text class="sub" x="958" y="340">MP1584</text><text class="ref" x="938" y="320">U1</text>
  <text class="pin" x="935" y="372">IN+</text><text class="pin" x="935" y="405">IN−</text><text class="pin" x="1080" y="372">OUT+</text><text class="pin" x="1080" y="405">OUT−</text>
  <path class="wire" d="M925 372 H900 V335 M925 405 H895 V485"/>
  <path class="wire power" d="M1130 372 H1200"/><use href="#tp" x="1160" y="372"/><text class="tptext" x="1160" y="376">TP9</text><text class="net" x="1138" y="353">+5V_SYS = 5.10 V</text>
  <path class="wire" d="M1130 405 H1160 V485"/>
  <text class="note" x="930" y="447">Önce yüksüz 5.10 V ayarla; sonra elektronik yükte doğrula.</text>
  <rect class="part" x="1200" y="342" width="80" height="58"/><text class="ref" x="1208" y="360">JP1</text><text class="txt" x="1214" y="383">SERVICE</text>
  <path class="wire power" d="M1280 372 H1340"/><text class="net" x="1284" y="353">+5V_ISO</text>
  <text class="note" x="1195" y="430">USB programlama sırasında JP1 açık.</text>

  <!-- amplifier power branch -->
  <path class="wire power" d="M875 335 V505 H1540 V630"/><text class="net" x="1390" y="495">VBAT_SW → XH-A232 VCC</text>
  <path class="wire" d="M540 485 H1880"/>

  <!-- ESP32 section -->
  <text class="head" x="55" y="635">ESP32-S3 Module &amp; Controls</text>
  <rect class="part" x="330" y="680" width="360" height="360"/>
  <text class="sub" x="405" y="720">ESP32-S3 DEVKIT</text><text class="value" x="430" y="744">N8R8 prototip adayı</text>
  <text class="pin" x="342" y="785">5V/VBUS</text><text class="pin" x="342" y="820">3V3</text><text class="pin" x="342" y="855">GND</text>
  <text class="pin" x="560" y="785">GPIO4 / BCLK</text><text class="pin" x="560" y="825">GPIO5 / LRCLK</text><text class="pin" x="560" y="865">GPIO6 / DATA</text><text class="pin" x="560" y="905">GPIO7 / BUTTON</text><text class="pin" x="560" y="945">GPIO8 / LED_R</text><text class="pin" x="560" y="975">GPIO9 / LED_G</text><text class="pin" x="560" y="1005">GPIO10 / LED_B</text>
  <path class="wire power" d="M1340 372 V580 H300 V785 H330"/><text class="net" x="275" y="768">+5V_ISO</text>
  <path class="wire" d="M330 855 H285 V1100"/><use href="#gnd" x="285" y="1100"/>
  <path class="wire" d="M330 820 H260"/><use href="#tp" x="285" y="820"/><text class="tptext" x="285" y="824">TP10</text><text class="net" x="205" y="802">+3V3</text>

  <!-- button -->
  <text class="sub" x="55" y="720">Function button</text>
  <path class="wire" d="M110 760 V790"/><text class="net" x="90" y="750">+3V3</text><use href="#res" x="110" y="790" transform="rotate(90 110 790)"/><text class="ref" x="125" y="825">R_PU</text><text class="value" x="125" y="844">10 kΩ ADAY</text>
  <path class="wire signal" d="M110 866 H220"/><use href="#tp" x="160" y="866"/><text class="tptext" x="160" y="870">TP22</text><use href="#switch" x="220" y="866" transform="scale(.8) translate(55 216.5)"/>
  <path class="wire" d="M282 866 V925"/><use href="#gnd" x="282" y="925"/>
  <path class="wire signal" d="M282 866 H330 V905"/><text class="net" x="210" y="850">BUTTON_N</text>
  <use href="#cap" x="110" y="900" transform="rotate(90 110 900)"/><text class="ref" x="125" y="930">C_DB</text><text class="value" x="125" y="948">100 nF OPS.</text><path class="wire" d="M110 866 V900 M110 966 V990"/><use href="#gnd" x="110" y="990"/>

  <!-- RGB led -->
  <text class="sub" x="55" y="1060">RGB status LED</text>
  <path class="wire signal" d="M690 945 H735"/><use href="#tp" x="710" y="945"/><text class="tptext" x="710" y="949">TP23</text><use href="#res" x="735" y="945"/><text class="value" x="744" y="928">680 Ω ADAY</text>
  <path class="wire signal" d="M690 975 H735"/><use href="#tp" x="710" y="975"/><text class="tptext" x="710" y="979">TP24</text><use href="#res" x="735" y="975"/><text class="value" x="744" y="1010">330 Ω ADAY</text>
  <path class="wire signal" d="M690 1005 H735"/><use href="#tp" x="710" y="1005"/><text class="tptext" x="710" y="1009">TP25</text><use href="#res" x="735" y="1005"/>
  <circle class="part" cx="840" cy="945" r="12"/><circle class="part" cx="840" cy="975" r="12"/><circle class="part" cx="840" cy="1005" r="12"/><path class="wire" d="M811 945 H828 M811 975 H828 M811 1005 H828 M852 945 H875 V1060 M852 975 H875 M852 1005 H875"/><use href="#gnd" x="875" y="1060"/>

  <!-- PCM DAC -->
  <text class="head" x="760" y="635">PCM5102A Audio DAC</text>
  <rect class="part" x="900" y="685" width="300" height="340"/>
  <text class="sub" x="955" y="725">PCM5102A MODULE</text><text class="ref" x="910" y="706">U2</text>
