  <text class="sub" x="1420" y="720">XH-A232 / TPA3110</text><text class="ref" x="1400" y="702">U3</text><text class="value" x="1478" y="743">2 × BTL Class-D</text>
  <text class="pin" x="1402" y="780">VCC</text><text class="pin" x="1402" y="820">GND</text><text class="pin" x="1402" y="870">L_IN</text><text class="pin" x="1402" y="950">R_IN</text>
  <text class="pin" x="1620" y="845">L+</text><text class="pin" x="1620" y="885">L−</text><text class="pin" x="1620" y="945">R+</text><text class="pin" x="1620" y="985">R−</text>
  <path class="wire power" d="M1540 630 V780 H1390"/><path class="wire" d="M1390 820 H1350 V1100"/><use href="#gnd" x="1350" y="1100"/>
  <path class="wire signal" d="M1200 855 H1390 V870"/><use href="#tp" x="1230" y="855"/><text class="tptext" x="1230" y="859">TP14</text><use href="#tp" x="1360" y="870"/><text class="tptext" x="1360" y="874">TP16</text><text class="net" x="1245" y="842">WOOFER_AIN</text>
  <path class="wire signal" d="M1200 935 H1390 V950"/><use href="#tp" x="1230" y="935"/><text class="tptext" x="1230" y="939">TP15</text><use href="#tp" x="1360" y="950"/><text class="tptext" x="1360" y="954">TP17</text><text class="net" x="1245" y="922">TWEETER_AIN</text>
  <path class="wire signal" d="M1690 845 H1770"/><use href="#tp" x="1720" y="845"/><text class="tptext" x="1720" y="849">TP18</text>
  <path class="wire signal" d="M1690 885 H1770"/><use href="#tp" x="1720" y="885"/><text class="tptext" x="1720" y="889">TP19</text>
  <use href="#speaker" x="1770" y="865"/><text class="ref" x="1820" y="840">SPK1</text><text class="value" x="1820" y="860">WOOFER Ω TBD / G0</text>
  <path class="wire signal" d="M1690 945 H1730"/><use href="#tp" x="1715" y="945"/><text class="tptext" x="1715" y="949">TP20</text><use href="#cap" x="1730" y="945"/><text class="ref" x="1753" y="925">C_SAFE</text><text class="value" x="1740" y="978">FILM · TBD / G2</text>
  <path class="wire signal" d="M1796 945 H1810"/><path class="wire signal" d="M1690 985 H1810"/><use href="#tp" x="1715" y="985"/><text class="tptext" x="1715" y="989">TP21</text>
  <use href="#speaker" x="1810" y="965"/><text class="ref" x="1860" y="940">SPK2</text><text class="value" x="1860" y="960">TWEETER Ω TBD / G0</text>
