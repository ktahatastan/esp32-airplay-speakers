  <text class="note" x="1420" y="1095">Diferansiyel prob; alternatif: iki 10× prob GND→TP6, MATH=CH1−CH2.</text>

  <!-- test point index -->
  <text class="sub" x="55" y="1160">Test Point Index</text>
  <text class="small" x="60" y="1190">TP0 B− · TP1 B1 · TP2 B2 · TP3 B3 · TP4 B+ · TP5 P+ · TP6 P−/GND · TP7 F1 OUT · TP8 VBAT_SW · TP9 5.10 V · TP10 3V3</text>
  <text class="small" x="60" y="1213">TP11 BCLK · TP12 LRCLK · TP13 DATA · TP14/15 DAC L/R · TP16/17 AMP IN · TP18/19 WOOFER BTL · TP20/21 TWEETER BTL</text>
  <text class="small" x="60" y="1236">TP22 BUTTON · TP23/24/25 RGB PWM · TP26 CHARGE+ · TP27 NTC · Power sequence: CH1 TP8 · CH2 TP9 · CH3 TP10 · CH4 TP14/15</text>
  <text class="warn" x="60" y="1265">ENERJİ VERME KAPILARI: G0 sürücü ölçümü → G1 dummy-load → G2 tweeter HPF/limiter/C_SAFE → G3 güç/EMI → G4 batarya/şarj.</text>

