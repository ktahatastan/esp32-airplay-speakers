  <path class="wire signal" d="M690 785 H820 V855 H900"/><use href="#tp" x="790" y="785"/><text class="tptext" x="790" y="789">TP11</text><text class="net" x="704" y="772">I2S_BCLK</text>
  <path class="wire signal" d="M690 825 H800 V895 H900"/><use href="#tp" x="770" y="825"/><text class="tptext" x="770" y="829">TP12</text><text class="net" x="700" y="812">I2S_LRCLK</text>
  <path class="wire signal" d="M690 865 H780 V935 H900"/><use href="#tp" x="750" y="865"/><text class="tptext" x="750" y="869">TP13</text><text class="net" x="702" y="852">I2S_DATA</text>
